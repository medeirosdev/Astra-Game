<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Astra — diagnóstico de trackers</title>
    <style>
      body { font-family: monospace; background: #0a0a12; color: #eef2ff; padding: 24px; }
      h1 { font-size: 16px; }
      .row { padding: 8px 12px; margin: 6px 0; border-radius: 6px; background: #12131f; border-left: 4px solid #555; }
      .row.ok { border-left-color: #4fff8f; }
      .row.fail { border-left-color: #ff5c5c; }
      .row.pending { border-left-color: #ffb347; }
      code { opacity: 0.8; }
    </style>
  </head>
  <body>
    <h1>Testando WebSocket direto (sem Trystero) para cada tracker público</h1>
    <div id="out"></div>
    <script>
      const trackers = [
        "wss://tracker.webtorrent.dev",
        "wss://tracker.openwebtorrent.com",
        "wss://tracker.btorrent.xyz",
        "wss://tracker.files.fm:7073/announce",
      ];
      const out = document.getElementById("out");

      trackers.forEach((url) => {
        const row = document.createElement("div");
        row.className = "row pending";
        row.textContent = `${url} — conectando...`;
        out.appendChild(row);

        const startedAt = performance.now();
        const ws = new WebSocket(url);

        ws.onopen = () => {
          const ms = Math.round(performance.now() - startedAt);
          row.className = "row ok";
          row.textContent = `${url} — OK, conectou em ${ms}ms`;
          ws.close();
        };
        ws.onerror = () => {
          const ms = Math.round(performance.now() - startedAt);
          row.className = "row fail";
          row.textContent = `${url} — FALHOU depois de ${ms}ms`;
        };
        ws.onclose = (e) => {
          if (row.className === "row pending") {
            row.className = "row fail";
            row.textContent = `${url} — fechou sem abrir (code ${e.code})`;
          }
        };
      });
    </script>
  </body>
</html>
